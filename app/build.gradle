apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'cn.mhook.mhook'
    compileSdk 36
    buildToolsVersion "36.1.0"
    defaultConfig {
        applicationId "cn.mhook.mhook"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 23
        versionName "1.5.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            // 设置支持的SO库架构
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

configurations.all {
    exclude group: 'com.google.guava', module: 'listenablefuture'
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'com.qmuiteam:qmui:2.0.0-alpha08'
    implementation "com.qmuiteam:arch:2.0.0-alpha08"
    implementation 'com.github.tamsiree.RxTool:RxUI:2.5.9'
    implementation 'com.github.tamsiree.RxTool:RxKit:2.5.9'
    implementation 'org.greenrobot:eventbus:3.2.0'
    implementation 'com.lxj:xpopup:1.8.13'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.3'
    implementation 'com.github.arimorty:floatingsearchview:2.1.1'
    implementation 'com.nightonke:boommenu:2.1.1'
    implementation 'com.rengwuxian.materialedittext:library:2.1.4'
    implementation 'com.alibaba:fastjson:1.2.61'
    implementation 'com.github.princekin-f:EasyFloat:1.3.0'
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    implementation project(path: ':library')
    // implementation 'com.tencent.bugly:crashreport:latest.release'
    implementation 'com.tencent.bugly:crashreport_upgrade:latest.release'
//其中latest.release指代最新版本号，也可以指定明确的版本号，例如1.2.0
    implementation 'com.tencent.bugly:nativecrashreport:latest.release'
    //其中latest.release指代最新版本号，也可以指定明确的版本号，例如2.2.0
    implementation 'io.github.dreierf:material-intro-screen:0.0.6'
    implementation 'net.lingala.zip4j:zip4j:2.5.0'
    implementation 'com.github.didikee:AndroidDonate:0.1.0'
    implementation 'eu.darken.rxshell:core:1.0.9'
    implementation 'eu.darken.rxshell:root:1.0.9'
    implementation project(path: ':Bcore')
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
